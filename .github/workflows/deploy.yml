# push ขึ้น branch main เมื่อไร → อัปโหลดไฟล์ที่เปลี่ยนขึ้น Hostatom ผ่าน FTP อัตโนมัติ
# ต้องตั้ง Secrets ใน GitHub: Settings → Secrets and variables → Actions
#   FTP_SERVER      เช่น ftp.retc.ac.th หรือ IP ของเซิร์ฟเวอร์ (ดูในอีเมล/แผงควบคุม Hostatom)
#   FTP_USERNAME    ชื่อผู้ใช้ FTP
#   FTP_PASSWORD    รหัสผ่าน FTP
#   FTP_SERVER_DIR  โฟลเดอร์เว็บของ loykrathong.retc.ac.th ลงท้ายด้วย /
#                   เช่น domains/retc.ac.th/public_html/loykrathong/  หรือ  public_html/loykrathong/
name: Deploy to Hostatom

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # อัปโหลดเฉพาะไฟล์ที่เปลี่ยน และไม่แตะไฟล์ที่ไม่ได้อยู่ใน repo
          # (krathong.mp4 กับ app/api/config/config.php บนโฮสต์จึงไม่ถูกลบ/ทับ)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            **/*.sql
            app/docs/**
            app/.nojekyll
